<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Page</title>
</head>
<body>
    <h1>Welcome to My Basic HTML Page (4. HTML (5 Marks):)</h1>
    <p>This is a simple HTML file structure.</p>
    <ul>
        <li>Learning new programming languages</li>
        <li>Reading books about history and science</li>
        <li>Playing chess</li>
    </ul>
    
</body>
<script>
    // 1. Variables and Data Types (5 Marks):
    var x = 10;
    var y = "Hello";
    var result = x + y;
    console.log(result);
    // 2. Control Flow (5 Marks):
    // Check if a number is even or odd
    var number = 21;
    function isNumberEven(number) {
        return number % 2 === 0;
    }
    console.log(`${number} is ${isNumberEven(number) ? "even" : "odd"}`);
    //3. Functions (5 Marks):
    function greetUser(name) {
        console.log(`Hello, ${name}!`);
    }
    greetUser("John");
    greetUser("Kim");
    greetUser("Ngoc");
</script>
</html>
